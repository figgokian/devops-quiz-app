name: CI/CD Quiz App

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/quiz-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/quiz-frontend

jobs:
  lint:
    name: Lint YAML, JS & HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & Python
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate YAML files
        run: |
          pip install pyyaml
          python3 -c '
          import glob, yaml
          for f in glob.glob("openshift/*.yml") + glob.glob("docker-compose/*.yml"):
              with open(f) as stream:
                  list(yaml.safe_load_all(stream))
              print("OK:", f)
          '
      - name: Validate JavaScript syntax
        run: |
          find app -name "*.js" -exec node --check {} +
      - name: Validate HTML structure
        run: |
          npx -y htmlhint "app/**/*.html"

  build:
    name: Build & Push Images
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfiles/Dockerfile.backend
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.BACKEND_IMAGE }}:v1,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfiles/Dockerfile.frontend
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.FRONTEND_IMAGE }}:v1,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to OpenShift
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenShift CLI (oc)
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"
      - name: Login to OpenShift
        run: |
          oc login --token="${{ secrets.OPENSHIFT_TOKEN }}" --server="${{ secrets.OPENSHIFT_SERVER }}" --insecure-skip-tls-verify=true
          oc project "${{ secrets.OPENSHIFT_NAMESPACE }}"
      - name: Apply OpenShift Manifests & Restart Rollouts
        run: |
          oc apply -f openshift/
          oc rollout restart deployment/quiz-backend deployment/quiz-frontend
          oc rollout status deployment/quiz-backend
          oc rollout status deployment/quiz-frontend
