name: Destroy OpenShift Environment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tippe DESTROY zur Bestätigung'
        required: true
        default: 'DESTROY'

jobs:
  destroy:
    name: Remove all OpenShift resources (incl. PVCs)
    if: github.event.inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenShift CLI (oc)
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.16"
      - name: Login & Delete Resources
        run: |
          oc login --token="${{ secrets.OPENSHIFT_TOKEN }}" --server="${{ secrets.OPENSHIFT_SERVER }}" --insecure-skip-tls-verify=true
          oc project "${{ secrets.OPENSHIFT_NAMESPACE }}"
          oc delete -f openshift/ --ignore-not-found=true
