services:
  db:
    image: postgres:18.4
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile.backend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile.frontend
    restart: always
    env_file:
      - .env
    environment:
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
